 <script>
    const menu=document.getElementById('menubar');
    const menuphone=document.getElementById('menuphone');
    const turnoff=document.getElementById('turnoff');
    turnoff.addEventListener('click',()=>{
        menuphone.classList.remove('active');
    })
    menu.addEventListener('click',()=>{
        menu.classList.toggle('open');
        menuphone.classList.toggle('active');
    })




    // email code

//  phone code
const phone = document.getElementById("phone");

phone.addEventListener("input", () => {

  phone.value = phone.value.replace(/[^0-9]/g, "");

 

});

document.getElementById("goCheck").addEventListener("click", () => {
  localStorage.setItem("name", document.getElementById("name").value);
  localStorage.setItem("email", document.getElementById("email").value);
  localStorage.setItem("phone", document.getElementById("phone").value);
  localStorage.setItem("message", document.getElementById("message").value);
});
    document.getElementById("shit").addEventListener("click", () => {
    window.location.href = "../html/index.html";
  });
