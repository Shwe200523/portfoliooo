<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="img/favicon.ico" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@1.0.15/destyle.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/register.css" />
    <title>.SELECT - 登録完了</title>
  </head>
  <body>
    <div id="header_placeholder"></div>

    <section class="reg-complete">

      <div class="reg-complete__icon">
        <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="30" r="28" stroke="#3d5a40" stroke-width="2.5"/>
          <polyline points="17,31 26,40 43,22" stroke="#3d5a40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="reg-complete__head">
        <h2>COMPLETE</h2>
        <p class="reg-complete__title">登録が完了しました</p>
        <p class="reg-complete__text">
          会員登録ありがとうございます。<br />
          引き続きログインしてお買い物をお楽しみください。
        </p>
      </div>

      <div class="reg-complete__btn-wrap">
        <a href="login.html" class="reg-complete__btn">ログインする</a>
        <a href="index.html" class="reg-complete__btn reg-complete__btn--ghost">TOPへ戻る</a>
      </div>

    </section>

    <div id="footer-placeholder"></div>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
  </body>
</html>
